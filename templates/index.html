<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Video Automation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --input: #0f3460;
            --accent: #00d4ff;
            --green: #00e676;
            --text: #e6e6e6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }
        .dashboard {
            display: none;
            grid-template-columns: 350px 1fr 350px;
            gap: 20px;
            width: 100%; max-width: 1400px;
            padding: 20px; box-sizing: border-box;
            align-items: start;
        }
        .header { width: 100%; text-align: center; }
        h1 { color: var(--accent); margin-bottom: 5px; }
        p.subtitle { color: #888; margin-top: 0; }
        
        .col {
            background: var(--card); border: 1px solid var(--input);
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
        }
        .col-red { border: 2px solid red; }
        .col-blue { border: 2px solid #00d4ff; }
        .col-green { border: 2px solid #00e676; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%; padding: 10px; background: var(--input);
            border: 1px solid var(--accent); color: white; border-radius: 4px;
            box-sizing: border-box; margin-bottom: 10px;
        }
        
        /* Canvas */
        .canvas-container-wrapper {
            display: flex; justify-content: center; margin: 15px 0;
            background: #000; border: 2px solid var(--accent);
        }
        
        /* Toolbar */
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px;}
        .btn {
            background: #e53935; color: white; border: none; padding: 8px 12px;
            border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        .btn-yellow { background: #ffeb3b; color: #000; }
        .btn-clear { background: #888; color: white; }
        
        .gen-btn {
            background: var(--green); color: white; width: 100%;
            padding: 15px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
            margin-top: 10px;
        }
        .gen-btn:disabled { background: #555; cursor: not-allowed; }
        
        #status { text-align: center; margin-top: 15px; font-weight: bold; color: var(--accent); }
        .loader {
            border: 4px solid var(--card); border-top: 4px solid var(--accent);
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;
            margin: 10px auto; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Auth Overlay */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #auth-box {
            background: var(--card); padding: 30px; border-radius: 12px;
            border: 2px solid var(--accent); text-align: center; width: 80%; max-width: 350px;
        }
    </style>
</head>
<body>

<!-- Lock Screen -->
<div id="auth-overlay">
    <div id="auth-box">
        <h2 style="color:var(--accent); margin-top:0;">🔒 Locked</h2>
        <p style="color:#aaa; font-size:14px; margin-bottom:20px;">Enter the secret password to access the studio.</p>
        <input type="password" id="auth_pwd" placeholder="Enter password..." style="text-align:center; font-size:18px;">
        <button class="gen-btn" onclick="unlockApp()" style="margin-top:10px;">UNLOCK</button>
        <p id="auth-error" style="color:red; display:none; margin-top:10px;">Incorrect Password!</p>
    </div>
</div>

<div class="header" id="main-header" style="display:none;">
    <h1>AI VIDEO</h1>
    <p class="subtitle">Cloud Automation Studio</p>
</div>

<div class="dashboard" id="main-app">
    <!-- LEFT COLUMN: Red Border (Inputs & Preview) -->
    <div class="col col-red">
        <input type="hidden" id="app_pwd">
        <label>Game Name</label>
        <input type="text" id="game_name" placeholder="e.g. One State RP">
        
        <label>Videos to Generate</label>
        <input type="number" id="max_videos" value="1" min="1" max="10">

        <label>CPA Landing Page Link</label>
        <input type="text" id="landing_url" placeholder="https://your-landing-page.com">
        
        <label>Channel Screenshot</label>
        <input type="file" id="screenshot" accept="image/*">

        <h3 style="text-align:center;">PREVIEW EDITOR</h3>
        <p style="text-align:center; font-size:12px; color:#aaa;">9:16 Ratio for Shorts & TikTok</p>
        
        <div class="canvas-container-wrapper">
            <canvas id="c" width="270" height="480"></canvas>
        </div>

        <div class="toolbar">
            <button class="btn" onclick="addCircle()">O Circle</button>
            <button class="btn" onclick="addArrow()">▼ Arrow</button>
            <button class="btn" onclick="addFinger()">☝ Finger</button>
            <button class="btn btn-yellow" onclick="addText('Click Here!')">Click Here!</button>
            <button class="btn btn-yellow" onclick="addText('Download!')">Download!</button>
            <button class="btn btn-clear" onclick="clearStickers()">Clear</button>
        </div>

        <button id="genBtn" class="gen-btn" onclick="generateVideos()">GENERATE VIDEOS</button>
        <button id="cancelBtn" class="gen-btn" onclick="cancelGeneration()" style="display:none; background:#e53935; margin-top:5px;">CANCEL</button>
    </div>

    <!-- MIDDLE COLUMN: Blue Border (Progress Logs & Video Output) -->
    <div class="col col-blue" style="justify-content:space-between;">
        <div>
            <h3 style="color:var(--accent); text-align:center; margin-top:0;">Pipeline Status</h3>
            <div id="loading" class="loader"></div>
            <p id="status" style="white-space:pre-wrap; text-align:left; font-family:monospace; color:#00e676; min-height:200px; background:#000; padding:10px; border-radius:4px;"></p>
        </div>
        
        <div id="video_output_container" style="display:none; border-top:2px solid var(--accent); padding-top:15px;">
            <h3 style="text-align:center; margin-top:0;">Final Video (9:16)</h3>
            <video id="output_video" controls style="width:100%; max-height:500px; border-radius:8px; background:#000;"></video>
        </div>
    </div>

    <!-- RIGHT COLUMN: Green Border (SEO & Thumbnail) -->
    <div class="col col-green">
        <h3 style="color:#00e676; text-align:center; margin-top:0;">Generated SEO</h3>
        <div id="seo_output" style="display:none;">
            <label>YouTube Title:</label>
            <textarea id="yt_title" rows="2" style="width:100%; background:var(--input); color:white; border:none; padding:5px; margin-bottom:10px;" readonly></textarea>
            
            <label>YouTube Description:</label>
            <textarea id="yt_desc" rows="10" style="width:100%; background:var(--input); color:white; border:none; padding:5px; margin-bottom:10px;" readonly></textarea>
            
            <label>TikTok / X Hashtags:</label>
            <textarea id="tt_tags" rows="3" style="width:100%; background:var(--input); color:white; border:none; padding:5px; margin-bottom:10px;" readonly></textarea>
        </div>
        <p id="seo_placeholder" style="text-align:center; color:#555;">Waiting for generation...</p>

        <div id="thumb_container" style="display:none; margin-top:20px;">
            <h3 style="color:#00e676; text-align:center;">Video Thumbnail</h3>
            <img id="output_thumb" src="" style="width:100%; border-radius:8px; border:2px solid #00e676;">
        </div>
    </div>
</div>

<script>
    // Initialize Fabric.js Canvas
    const canvas = new fabric.Canvas('c');
    let bgImage = null;

    // Handle Image Upload
    document.getElementById('screenshot').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(f) {
            const data = f.target.result;
            fabric.Image.fromURL(data, function(img) {
                // Auto-scale to fit
                const scale = 270 / img.width;
                img.set({
                    left: 0, top: 240 - ((img.height * scale) / 2),
                    scaleX: scale, scaleY: scale,
                    selectable: true, hasControls: true
                });
                
                if (bgImage) canvas.remove(bgImage);
                bgImage = img;
                canvas.insertAt(bgImage, 0); // Always at bottom
                canvas.renderAll();
            });
        };
        reader.readAsDataURL(file);
    });

    // Stickers
    function addCircle() {
        const circle = new fabric.Circle({
            radius: 40, fill: 'transparent', stroke: 'red', strokeWidth: 4,
            left: 135, top: 240, originX: 'center', originY: 'center',
            transparentCorners: false, cornerColor: 'white', borderColor: '#00d4ff', customKind: 'circle'
        });
        canvas.add(circle);
        canvas.setActiveObject(circle);
    }

    function addArrow() {
        const arrow = new fabric.Polygon([
            {x: 0, y: -25}, {x: -15, y: 12}, {x: 15, y: 12}
        ], {
            fill: 'red', left: 135, top: 240, originX: 'center', originY: 'center',
            transparentCorners: false, cornerColor: 'white', borderColor: '#00d4ff', customKind: 'arrow', scaleX: 1.5, scaleY: 1.5
        });
        canvas.add(arrow);
        canvas.setActiveObject(arrow);
    }

    function addFinger() {
        const text = new fabric.Text("☝", {
            fill: 'red', fontSize: 40, left: 135, top: 240, originX: 'center', originY: 'center',
            transparentCorners: false, cornerColor: 'white', borderColor: '#00d4ff', customKind: 'finger'
        });
        canvas.add(text);
        canvas.setActiveObject(text);
    }

    function addText(str) {
        const text = new fabric.Text(str, {
            fill: 'yellow', backgroundColor: 'rgba(0,0,0,0.8)', fontSize: 18, fontWeight: 'bold',
            left: 135, top: 240, originX: 'center', originY: 'center', padding: 5,
            transparentCorners: false, cornerColor: 'white', borderColor: '#00d4ff', customKind: 'text', customText: str
        });
        canvas.add(text);
        canvas.setActiveObject(text);
    }

    function clearStickers() {
        const objects = canvas.getObjects();
        objects.forEach(obj => {
            if (obj !== bgImage) canvas.remove(obj);
        });
    }

    // Auth Logic
    async function unlockApp() {
        const pwd = document.getElementById('auth_pwd').value;
        if (!pwd) return;
        
        try {
            const res = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pwd: pwd })
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('app_pwd').value = pwd; // Save for generate
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'grid';
                document.getElementById('main-header').style.display = 'block';
            } else {
                const err = document.getElementById('auth-error');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 3000);
            }
        } catch (e) {
            alert("Network error checking password.");
        }
    }

    // Export Layout and Submit to API
    async function generateVideos() {
        const pwd = document.getElementById('app_pwd').value;
        const game = document.getElementById('game_name').value;
        const url = document.getElementById('landing_url').value;
        const max_v = document.getElementById('max_videos').value;
        const fileInput = document.getElementById('screenshot').files[0];

        if (!pwd) return alert("Please enter the password!");
        if (!game) return alert("Enter game name!");
        if (!url) return alert("Enter landing page link!");
        if (!fileInput) return alert("Upload a screenshot!");

        // Extract layout mapping format
        const overlays = [];
        let ss_ox = 0, ss_oy = 0, ss_zoom = 1.0;
        let link_x = 0.5, link_y = 0.96, link_scale = 1.0;

        canvas.getObjects().forEach(obj => {
            const cx = obj.left / 270;
            const cy = obj.top / 480;
            
            if (obj === bgImage) {
                // Screenshot calculations
                const auto_scale = 270 / obj.width;
                ss_zoom = obj.scaleX / auto_scale;
                ss_ox = (obj.left + (obj.width * obj.scaleX)/2 - 135) / 270;
                ss_oy = (obj.top + (obj.height * obj.scaleY)/2 - 240) / 480;
            } else if (obj === linkTextObj) {
                link_x = cx;
                link_y = cy;
                link_scale = obj.scaleX;
            } else if (obj.customKind) {
                const s = obj.scaleX;
                const overlay = { kind: obj.customKind, cx: cx, cy: cy, size: s };
                if (obj.customKind === 'circle') {
                    overlay.rx = (obj.radius * s) / 270;
                    overlay.ry = (obj.radius * s) / 480;
                }
                if (obj.customKind === 'text') overlay.text = obj.customText;
                overlays.push(overlay);
            }
        });

        const layout = { ss_ox, ss_oy, ss_zoom, link_x, link_y, link_scale };

        // Freeze canvas
        canvas.getObjects().forEach(o => { o.selectable = false; o.evented = false; });
        canvas.discardActiveObject();
        canvas.renderAll();

        // Prepare FormData
        const formData = new FormData();
        formData.append('pwd', pwd);
        formData.append('game', game);
        formData.append('url', url);
        formData.append('max', max_v);
        formData.append('screenshot', fileInput);
        formData.append('overlays', JSON.stringify(overlays));
        formData.append('layout', JSON.stringify(layout));

        // UI Loading State
        const btn = document.getElementById('genBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const loader = document.getElementById('loading');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        cancelBtn.style.display = 'inline-block';
        loader.style.display = 'block';
        status.innerText = "Initializing...";

        window.abortController = new AbortController();

        // Polling loop
        const pollInterval = setInterval(async () => {
            try {
                const res = await fetch('/api/status');
                const stData = await res.json();
                if (stData.message && status.innerText.indexOf('✅') === -1 && status.innerText.indexOf('❌') === -1 && status.innerText.indexOf('⏸️') === -1) {
                    status.innerText = stData.message;
                }
            } catch (e) {}
        }, 1500);

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                body: formData,
                signal: window.abortController.signal
            });
            const data = await response.json();
            
            clearInterval(pollInterval);
            
            if (response.ok) {
                status.innerText = `✅ Success! Generated videos. Delivery to Telegram!`;
                status.style.color = "#00e676";
                
                // Show Video Output
                if (data.video_url) {
                    document.getElementById('video_output_container').style.display = 'block';
                    const vidEl = document.getElementById('output_video');
                    vidEl.src = data.video_url;
                    vidEl.play();
                }

                // Show SEO & Thumbnail
                document.getElementById('seo_placeholder').style.display = 'none';
                document.getElementById('seo_output').style.display = 'block';
                
                if (data.seo) {
                    if (data.seo.youtube) {
                        document.getElementById('yt_title').value = data.seo.youtube.title || "";
                        document.getElementById('yt_desc').value = data.seo.youtube.description || "";
                    }
                    if (data.seo.tiktok) {
                        document.getElementById('tt_tags').value = (data.seo.tiktok.hashtags || []).map(t => '#' + t).join(' ');
                    }
                }

                if (data.thumb_url) {
                    document.getElementById('thumb_container').style.display = 'block';
                    document.getElementById('output_thumb').src = data.thumb_url;
                }
                
            } else {
                status.innerText = `❌ Error: ${data.error}`;
                status.style.color = "red";
            }
        } catch (e) {
            clearInterval(pollInterval);
            if (e.name === 'AbortError') {
                status.innerText = "⏸️ Cancelled.";
            } else {
                status.innerText = "❌ Network error. But if Telegram receives the video, it worked!";
            }
            status.style.color = "red";
        }

        btn.disabled = false;
        cancelBtn.style.display = 'none';
        loader.style.display = 'none';
        canvas.getObjects().forEach(o => { o.selectable = true; o.evented = true; });
    }

    function cancelGeneration() {
        if (window.abortController) {
            window.abortController.abort();
        }
    }

    // Show CPA Link on Canvas Live
    let linkTextObj = null;
    document.getElementById('landing_url').addEventListener('input', function(e) {
        const urlStr = e.target.value;
        if (!linkTextObj) {
            linkTextObj = new fabric.Text(urlStr, {
                fill: '#64dcff', backgroundColor: 'rgba(0,0,0,0.8)', fontSize: 14, fontWeight: 'normal',
                left: 135, top: 460, originX: 'center', originY: 'center', padding: 5,
                selectable: true, evented: true
            });
            canvas.add(linkTextObj);
        } else {
            linkTextObj.set({text: urlStr});
            canvas.renderAll();
        }
        canvas.bringToFront(linkTextObj);
    });
</script>

</body>
</html>
