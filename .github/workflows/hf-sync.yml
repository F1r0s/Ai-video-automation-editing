name: Sync to Hugging Face Hub

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true          # pull LFS objects so they get pushed to HF too

      - name: Install Git LFS
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create a clean orphan branch with no history
          git checkout --orphan hf-deploy
          
          # Add all current files (respecting .gitignore and .gitattributes)
          git add .
          git commit -m "Deploy to HF Space"
          
          # Push to HF Space main branch
          git remote add space https://hf_user:$HF_TOKEN@huggingface.co/spaces/HIGMA55/video-automation-bot
          git push --force space hf-deploy:main
